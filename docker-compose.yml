services:
  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/mosquitto/config/docker-entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/config/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    depends_on:
      - postgres
    env_file: .env
    environment:
      BACKUP_INTERVAL: "86400"        # раз в сутки
      BACKUP_RETENTION_DAYS: "7"      # хранить неделю
    entrypoint: ["/bin/sh", "/scripts/postgres-backup.sh"]
    volumes:
      - ./scripts/postgres-backup.sh:/scripts/postgres-backup.sh:ro
      - ./data/backups:/backups
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: cmd/ingest/Dockerfile
    env_file: .env
    depends_on:
      - mosquitto
      - postgres
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: cmd/web/Dockerfile
    env_file: .env
    environment:
      WEB_LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
      - postgres
    restart: unless-stopped

volumes:
  mosquitto-data:
  postgres-data:
